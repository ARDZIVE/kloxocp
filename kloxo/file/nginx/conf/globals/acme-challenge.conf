	# Serve ACME HTTP-01 from the vhost document root (not a separate
	# /var/run path). Certbot --webroot-path must be that same docroot so
	# try_files finds the token. ^~ beats regex PHP locations.
	location ^~ /.well-known/acme-challenge/ {
		default_type "text/plain";
		allow all;
		auth_basic off;
		satisfy any;
		try_files $uri =404;
	}

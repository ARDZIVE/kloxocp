	# ^~ wins over regex locations; root (not alias) maps URI under webroot.
	# Must stay ahead of https/www redirects (those skip this path in domains.conf.tpl).
	location ^~ /.well-known/acme-challenge/ {
		default_type "text/plain";
		root /var/run/letsencrypt;
		allow all;
		auth_basic off;
		satisfy any;
		try_files $uri =404;
	}

# Kloxo CP (GENERATED). Keys are created per domain by `kloxo-mail dkim:generate`.
# Only domains listed in the generated maps are signed (maps are rebuilt from the database
# by `kloxo-mail apply` and automatically after domain / DKIM changes).
enabled = true;
selector_map = "@@RSPAMD_DIR@@/kloxo/dkim_selectors.map";
path_map = "@@RSPAMD_DIR@@/kloxo/dkim_paths.map";
sign_authenticated = true;
sign_local = true;
use_esld = false;
try_fallback = false;
allow_username_mismatch = false;

# ---------------------------------------------------------------------------
# Kloxo CP: Exim 4 configuration  (GENERATED by `kloxo-mail render`, do not edit)
# Put your own settings in /etc/kloxo/mail.d/exim4.conf; they are inserted in
# the main section below and survive updates.
# ---------------------------------------------------------------------------
primary_hostname = @@HOSTNAME@@
qualify_domain = @@HOSTNAME@@
qualify_recipient = @@HOSTNAME@@

daemon_smtp_ports = 25 : 587 : 465
tls_on_connect_ports = 465
local_interfaces = @@EXIM_LOCAL_INTERFACES@@
disable_ipv6 = @@EXIM_DISABLE_IPV6@@

never_users = root
# Panel FPM and kloxocp test-mail (after dropping root) submit as lxlabs with
# -f admin@hostname. Without this, Exim ignores -f and can queue <> / freeze.
trusted_users = lxlabs
keep_environment =
percent_hack_domains =
local_from_check = false
helo_allow_chars = _
rfc1413_query_timeout = 0s
smtp_banner = $primary_hostname ESMTP
message_size_limit = @@MESSAGE_SIZE_LIMIT@@
ignore_bounce_errors_after = 2d
timeout_frozen_after = 7d
smtp_accept_max = 200
smtp_accept_max_per_host = 50

# Mail database (SELECT-only). Mode 0640, group Debian-exim.
hide mysql_servers = "(@@DB_SOCKET@@)/@@DB_NAME@@/@@DB_RO_USER@@/@@DB_RO_PASS@@"

domainlist kloxo_mail_domains = mysql;SELECT name FROM domains WHERE name='${quote_mysql:$key}' AND active=1
hostlist kloxo_local_hosts = <; 127.0.0.0/8 ; ::1
@@POLICY_MAIN@@

# AUTH only on submission (587 STARTTLS / 465 implicit TLS). Port 25 never advertises it.
auth_advertise_hosts = ${if and{{def:tls_in_cipher}{or{{eq{$received_port}{587}}{eq{$received_port}{465}}}}}{*}{}}
tls_advertise_hosts = *
tls_certificate = @@TLS_CERT@@
tls_privatekey = @@TLS_KEY@@
# Ubuntu Exim is GnuTLS-built: openssl_options is rejected ("we're using GnuTLS").
# tls_require_ciphers is a GnuTLS priority string (disables SSL3 / TLS1.0 / TLS1.1).
tls_require_ciphers = SECURE128:-VERS-SSL3.0:-VERS-TLS1.0:-VERS-TLS1.1

# Rspamd (spamassassin protocol). No defer_ok: a down scanner tempfails.
spamd_address = 127.0.0.1 11333 variant=rspamd

acl_smtp_connect = acl_check_connect
acl_smtp_helo = acl_check_helo
acl_smtp_mail = acl_check_mail
acl_smtp_rcpt = acl_check_rcpt
acl_smtp_data = acl_check_data
acl_smtp_vrfy = acl_deny_all
acl_smtp_expn = acl_deny_all
acl_not_smtp = acl_check_not_smtp

@@CUSTOM_SNIPPET@@

begin acl

acl_deny_all:
  deny    message = VRFY/EXPN disabled

acl_check_connect:
@@POLICY_CONNECT@@
  accept

acl_check_helo:
  accept  hosts = :
  accept  hosts = +kloxo_local_hosts
  deny    message = HELO requires a domain name
          condition = ${if match{$sender_helo_name}{\N\.\N}{no}{yes}}
  accept

acl_check_mail:
  accept  hosts = :
  deny    message = HELO required
          condition = ${if eq{$sender_helo_name}{}{yes}{no}}
  deny    message = AUTH requires TLS
          authenticated = *
          !encrypted = *
  deny    message = sender does not match authenticated user
          authenticated = *
          !condition = ${lookup mysql{SELECT 1 FROM ( \
            SELECT m.email AS login FROM mailboxes m JOIN domains d ON d.id = m.domain_id \
              WHERE m.email = '${quote_mysql:$sender_address}' AND m.active = 1 AND d.active = 1 \
            UNION \
            SELECT m.email AS login FROM aliases a \
              JOIN alias_targets t ON t.alias_id = a.id \
              JOIN mailboxes m ON m.email = t.target \
              JOIN domains d ON d.id = a.domain_id \
              WHERE a.source = '${quote_mysql:$sender_address}' AND a.active = 1 AND d.active = 1 AND m.active = 1 \
          ) s WHERE s.login = '${quote_mysql:$authenticated_id}'}{yes}{no}}
@@POLICY_MAIL@@
@@POLICY_SENDER_VERIFY@@
  accept

acl_check_rcpt:
  accept  hosts = :

  deny    message = Restricted characters in address
          domains = +kloxo_mail_domains
          local_parts = ^[.] : ^.*[@%!/|]

  deny    message = TLS required on submission
          condition = ${if or{{eq{$received_port}{587}}{eq{$received_port}{465}}}{yes}{no}}
          !encrypted = *

  deny    message = authentication required
          condition = ${if or{{eq{$received_port}{587}}{eq{$received_port}{465}}}{yes}{no}}
          !authenticated = *

  # Quota before the local-network permit so localhost cannot bypass a full mailbox.
  warn    set acl_m_quota = ${readsocket{/run/dovecot/quota-status}{request=smtpd_access_policy${nl}protocol_state=RCPT${nl}recipient=${quote:$local_part@$domain}${nl}${nl}}{20s}{${nl}}{TEMPFAIL}}
  defer   message = quota check unavailable
          condition = ${if eq{$acl_m_quota}{TEMPFAIL}{yes}{no}}
  defer   message = mailbox is full
          condition = ${if match{$acl_m_quota}{\Naction=452\N}{yes}{no}}

  accept  authenticated = *
          encrypted = *

  accept  hosts = +kloxo_local_hosts

@@POLICY_RCPT@@
  accept  domains = +kloxo_mail_domains
          endpass
          message = Unknown user
          verify = recipient

  deny    message = relay not permitted

acl_check_data:
@@POLICY_DATA@@
  warn    spam = nobody:true
  defer   message = spam filter unavailable
          !condition = ${if def:spam_score {yes}{no}}
  deny    message = message rejected by spam filter
          condition = ${if eq{$spam_action}{reject}{yes}{no}}
  accept

acl_check_not_smtp:
  accept

begin routers

kloxo_remote:
  driver = dnslookup
  domains = !+kloxo_mail_domains
  transport = remote_smtp
  ignore_target_hosts = <; 0.0.0.0 ; 127.0.0.0/8 ; ::1
  no_more

# Exact alias first so a forward-only mailbox is not also delivered locally.
kloxo_alias:
  driver = redirect
  domains = +kloxo_mail_domains
  local_part_suffix = +*
  local_part_suffix_optional
  allow_fail
  allow_defer
  # Redirect data is MySQL addresses only (allow_filter stays off by default).
  forbid_file
  forbid_pipe
  data = ${lookup mysql{SELECT t.target FROM aliases a JOIN alias_targets t ON t.alias_id = a.id JOIN domains d ON d.id = a.domain_id WHERE a.source = '${quote_mysql:$local_part@$domain}' AND a.active = 1 AND d.active = 1}}

kloxo_mailbox:
  driver = accept
  domains = +kloxo_mail_domains
  local_part_suffix = +*
  local_part_suffix_optional
  condition = ${lookup mysql{SELECT 1 FROM mailboxes m JOIN domains d ON d.id = m.domain_id WHERE m.email = '${quote_mysql:$local_part@$domain}' AND m.active = 1 AND d.active = 1}{yes}{no}}
  transport = dovecot_lmtp

# Catch-all only after mailbox and exact alias, so it cannot swallow a real account.
kloxo_catchall:
  driver = redirect
  domains = +kloxo_mail_domains
  allow_fail
  allow_defer
  forbid_file
  forbid_pipe
  data = ${lookup mysql{SELECT t.target FROM aliases a JOIN alias_targets t ON t.alias_id = a.id JOIN domains d ON d.id = a.domain_id WHERE a.source = '${quote_mysql:@$domain}' AND a.active = 1 AND d.active = 1}}

kloxo_unknown:
  driver = redirect
  domains = +kloxo_mail_domains
  allow_fail
  data = :fail: Unknown user

begin transports

dovecot_lmtp:
  driver = lmtp
  socket = /run/dovecot/lmtp
  batch_max = 20
  rcpt_include_affixes = true

remote_smtp:
  driver = smtp
  tls_require_ciphers = SECURE128:-VERS-SSL3.0:-VERS-TLS1.0:-VERS-TLS1.1

begin retry

*                      *           F,2h,15m; G,16h,1h,1.5; F,4d,6h

begin rewrite
begin authenticators

dovecot_plain:
  driver = dovecot
  public_name = PLAIN
  server_socket = /run/dovecot/auth-client
  server_set_id = $auth1
  server_advertise_condition = ${if and{{def:tls_in_cipher}{or{{eq{$received_port}{587}}{eq{$received_port}{465}}}}}{yes}{no}}

dovecot_login:
  driver = dovecot
  public_name = LOGIN
  server_socket = /run/dovecot/auth-client
  server_set_id = $auth1
  server_advertise_condition = ${if and{{def:tls_in_cipher}{or{{eq{$received_port}{587}}{eq{$received_port}{465}}}}}{yes}{no}}

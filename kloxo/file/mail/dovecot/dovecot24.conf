# ---------------------------------------------------------------------------
# Kloxo CP: Dovecot 2.4+ configuration  (GENERATED by `kloxo-mail render`, do not edit)
# Put your own settings in /etc/kloxo/mail.d/dovecot.conf; they are appended at
# the end of this file and survive updates.
# Ubuntu 26.x / Debian 13 ship Dovecot 2.4 (syntax is not compatible with 2.3).
# ---------------------------------------------------------------------------
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols {
  imap = yes
  pop3 = yes
  lmtp = yes
  sieve = yes
}
listen = @@DOVECOT_LISTEN@@
auth_allow_cleartext = no
auth_mechanisms = plain login
auth_username_format = %{user | lower}
auth_cache_size = 10M
auth_cache_ttl = 2 mins
auth_cache_negative_ttl = 1 mins
mail_max_userip_connections = 20

# --- storage: one system user (vmail), Maildir per mailbox ----------------------------
mail_uid = vmail
mail_gid = vmail
first_valid_uid = @@VMAIL_UID@@
last_valid_uid = @@VMAIL_UID@@
first_valid_gid = @@VMAIL_GID@@
last_valid_gid = @@VMAIL_GID@@
mail_privileged_group = vmail
mail_home = @@VMAIL_DIR@@/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path = ~/Maildir
mail_plugins {
  quota = yes
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
}

# --- authentication: mailbox table in the mail database (inline; no .conf.ext) ----------
sql_driver = mysql
mysql @@DB_SOCKET@@ {
  user = @@DB_RO_USER@@
  password = @@DB_RO_PASS@@
  dbname = @@DB_NAME@@
}

passdb sql {
  default_password_scheme = ARGON2ID
  query = SELECT m.email AS user, m.password_hash AS password FROM mailboxes m JOIN domains d ON d.id = m.domain_id WHERE m.email = '%{user | lower}' AND m.active = 1 AND d.active = 1
}

userdb sql {
  query = SELECT '@@VMAIL_DIR@@/%{user | domain}/%{user | username}' AS home, @@VMAIL_UID@@ AS uid, @@VMAIL_GID@@ AS gid, CONCAT(m.quota_mb, 'M') AS quota_storage_size FROM mailboxes m JOIN domains d ON d.id = m.domain_id WHERE m.email = '%{user | lower}' AND m.active = 1 AND d.active = 1
  iterate_query = SELECT m.email AS user FROM mailboxes m JOIN domains d ON d.id = m.domain_id WHERE m.active = 1 AND d.active = 1
}

# --- TLS: required for every login --------------------------------------------------------
ssl = required
ssl_server_cert_file = @@TLS_CERT@@
ssl_server_key_file = @@TLS_KEY@@
ssl_min_protocol = TLSv1.2
# 2.4 values are client|server (not yes|no). Prefer client for TLS 1.3.
ssl_server_prefer_ciphers = client

# --- services -------------------------------------------------------------------------------
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
service lmtp {
  unix_listener /run/dovecot/lmtp {
    mode = 0600
    user = @@EXIM_USER@@
    group = @@EXIM_GROUP@@
  }
}
service auth {
  unix_listener /run/dovecot/auth-client {
    mode = 0660
    user = @@EXIM_USER@@
    group = @@EXIM_GROUP@@
  }
  unix_listener auth-userdb {
    mode = 0660
    user = vmail
    group = vmail
  }
}
service auth-worker {
  user = vmail
}
# Lets Exim refuse mail for full mailboxes during the SMTP dialogue (no backscatter).
# `-p postfix` is Dovecot's policy-protocol name, not the MTA.
# 2.4 requires named listeners; Exim talks to the unix socket only (no inet).
service quota-status {
  executable = quota-status -p postfix
  client_limit = 1
  unix_listener /run/dovecot/quota-status {
    mode = 0660
    user = @@EXIM_USER@@
    group = @@EXIM_GROUP@@
  }
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
  postmaster_address = postmaster@@@HOSTNAME@@
}

quota "User quota" {
}
quota_status_success = DUNNO
quota_status_nouser = DUNNO
quota_status_overquota = "452 4.2.2 Mailbox is full"
quota_storage_grace = 10%%

sieve_script personal {
  sieve_script_type = personal
  sieve_script_path = ~/sieve
  sieve_script_active_path = ~/.dovecot.sieve
}
sieve_script before {
  sieve_script_type = before
  sieve_script_path = /var/lib/dovecot/sieve/before.d/
}
sieve_quota_storage_size = 1M

log_path = syslog

# ---------------------------------------------------------------------------
# Kloxo CP: Dovecot 2.3 configuration  (GENERATED by `kloxo-mail render`, do not edit)
# Put your own settings in /etc/kloxo/mail.d/dovecot.conf; they are appended at
# the end of this file and survive updates.
# ---------------------------------------------------------------------------
protocols = imap pop3 lmtp sieve
listen = @@DOVECOT_LISTEN@@
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %Lu
auth_cache_size = 10M
auth_cache_ttl = 2 mins
auth_cache_negative_ttl = 1 mins
mail_max_userip_connections = 20

# --- storage: one system user (vmail), Maildir per mailbox ----------------------------
mail_uid = vmail
mail_gid = vmail
first_valid_uid = @@VMAIL_UID@@
last_valid_uid = @@VMAIL_UID@@
first_valid_gid = @@VMAIL_GID@@
last_valid_gid = @@VMAIL_GID@@
mail_privileged_group = vmail
mail_home = @@VMAIL_DIR@@/%Ld/%Ln
mail_location = maildir:~/Maildir
mail_plugins = $mail_plugins quota

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
}

# --- authentication: mailbox table in the mail database ---------------------------------
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# --- TLS: required for every login --------------------------------------------------------
ssl = required
ssl_cert = <@@TLS_CERT@@
ssl_key = <@@TLS_KEY@@
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

# --- services -------------------------------------------------------------------------------
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  # SASL for Postfix
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  # userdb lookups for LMTP
  unix_listener auth-userdb {
    mode = 0660
    user = vmail
    group = vmail
  }
}
service auth-worker {
  user = vmail
}
# Lets Postfix refuse mail for full mailboxes during the SMTP dialogue (no backscatter).
service quota-status {
  executable = quota-status -p postfix
  client_limit = 1
  inet_listener {
    port = 0
  }
  unix_listener /var/spool/postfix/private/quota-status {
    mode = 0660
    user = postfix
    group = postfix
  }
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
}
protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@@@HOSTNAME@@
}

plugin {
  quota = maildir:User quota
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "452 4.2.2 Mailbox is full"
  quota_grace = 10%%

  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_before = /var/lib/dovecot/sieve/before.d/
  sieve_max_script_size = 1M
}

log_path = syslog

# Generated by Kloxo CP install-webfront. Do not edit by hand.
user www-data;
worker_processes 1;
pid /run/kloxo-webcache.pid;
error_log /var/log/kloxo/webcache.error.log;

events {
	worker_connections 128;
}

http {
	default_type application/octet-stream;
	access_log /var/log/kloxo/webcache.access.log;
	proxy_cache_path /var/cache/kloxo-webcache levels=1:2 keys_zone=kloxocache:8m max_size=64m inactive=10m use_temp_path=off;

	server {
		listen 8080 default_server;
		listen [::]:8080 default_server;
		server_name _;

		location / {
			proxy_pass http://127.0.0.1:80;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_cache kloxocache;
			proxy_cache_valid 200 10s;
			add_header X-Kloxo-Cache $upstream_cache_status;
		}
	}
}

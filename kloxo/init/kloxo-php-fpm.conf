[global]
pid=/opt/kloxo/init/kloxo-phpcgi.pid
error_log=/opt/kloxo/log/php-fpm-error.log
log_level=error

;emergency_restart_threshold=0
;emergency_restart_interval=0
;process_control_timeout=0

emergency_restart_threshold=10
emergency_restart_interval=1m
process_control_timeout=10s

daemonize=no

[kloxo]
listen = 127.0.0.1:39000
listen.backlog = 65535
listen.allowed_clients = 127.0.0.1
user = lxlabs
group = lxlabs
pm = dynamic
; Keep small: Domain Home used to hang with memory_limit=-1 and
; request_terminate_timeout=12000s, so a few stuck workers OOMed the host
; (even systemd) until a fresh install. Cap children × memory below RAM.
pm.max_children = 4
pm.max_requests = 200
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
; pm.status_path = /status
; ping.path = /ping
; ping.response = pong
; Kill hung Domain Home / frame-reload workers before they exhaust RAM.
; Uploads may run longer than interactive pages; keep this under a few minutes.
request_terminate_timeout = 120s
request_slowlog_timeout = 10s
slowlog = /opt/kloxo/log/php-fpm-slow.log
rlimit_files = 1024
rlimit_core = 0
; chroot = 
; chdir = /var/www
catch_workers_output = yes
security.limit_extensions = .php .php5 .php7

env[HOSTNAME] = $HOSTNAME
env[PATH] = /bin:/usr/bin:/sbin:/usr/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

php_admin_value[error_log] = /opt/kloxo/log/php-fpm-error.log

php_admin_flag[zlib.output_compression] = on
php_admin_value[disable_functions] = ""
php_admin_flag[display_errors] = off
php_admin_flag[file_uploads] = on
php_admin_value[upload_max_filesize] = 5120M
; Same filesystem as /home/kloxo/client/*/__backup so move_uploaded_file is a
; rename (PrivateTmp /tmp would force a multi-GB copy and abort on navigate).
php_admin_value[upload_tmp_dir] = /home/kloxo/php-upload
php_admin_flag[log_errors] = on
php_admin_flag[output_buffering] = off
php_admin_flag[register_argc_argv] = off
php_admin_flag[opcache.validate_timestamps] = on
php_admin_value[opcache.revalidate_freq] = 0
php_admin_value[post_max_size] = 5120M
; Long work (apt, backup pack, fixweb) must go through kloxo-backend, not FPM.
php_admin_value[max_execution_time] = 90
php_admin_value[max_input_time] = 600
php_admin_value[memory_limit] = 256M
php_admin_flag[allow_url_fopen] = on
php_admin_value[session.save_path] = /opt/kloxo/session
php_admin_flag[cgi.force_redirect] = on
php_admin_value[open_basedir] = ""
; Was 600: a stuck kloxo-backend RPC held Domain Home until OOM.
php_admin_value[default_socket_timeout] = 15
php_admin_value[max_input_vars] = 10000
